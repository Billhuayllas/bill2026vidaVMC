<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" />

  <!-- Decorative gold accent glow in top right -->
  <circle cx="430" cy="80" r="140" fill="url(#goldGrad)" opacity="0.12" />

  <!-- Main Open Book Icon with Shadow -->
  <g filter="url(#shadow)" transform="translate(64, 96)">
    <!-- Book Spine & Cover shadow -->
    <path d="M192,230 C130,205 60,205 10,218 L10,75 C60,62 130,62 192,86 C254,62 324,62 374,75 L374,218 C324,205 254,205 192,230 Z" fill="#0f172a" opacity="0.25" transform="translate(0, 10)" />
    
    <!-- Left Page -->
    <path d="M192,224 C132,198 62,198 12,212 L12,68 C62,54 132,54 192,80 Z" fill="url(#pageGrad)" />
    
    <!-- Right Page -->
    <path d="M192,224 C252,198 322,198 372,212 L372,68 C322,54 252,54 192,80 Z" fill="#ffffff" />
    
    <!-- Center Spine fold -->
    <path d="M190,78 L194,78 L194,226 L190,226 Z" fill="#cbd5e1" />
    
    <!-- Left Page Text Lines -->
    <line x1="42" y1="95" x2="162" y2="95" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="42" y1="120" x2="162" y2="120" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="42" y1="145" x2="140" y2="145" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="42" y1="170" x2="155" y2="170" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <!-- Right Page Text Lines -->
    <line x1="222" y1="95" x2="342" y2="95" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="222" y1="120" x2="342" y2="120" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="222" y1="145" x2="320" y2="145" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="222" y1="170" x2="335" y2="170" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <!-- Golden Ribbon / Bookmark -->
    <path d="M187,78 L197,78 L197,250 L192,242 L187,250 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom Badge: VMT 15 DE JULIO -->
  <g transform="translate(256, 420)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="#0f172a" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">CONGREGACIÓN</text>
  </g>
</svg>
