<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='planificador.css') }}">
    </head>
    <body class="bg-gray-100 planificador-page">
    <header class="bg-white shadow-md">
    {% include 'nav.html' %}
    </header>

    <main class="container mx-auto px-4 py-8">
        <div id="status" class="mb-4 p-4 rounded-md" style="display:none;"></div>
        <div class="bg-white shadow-md rounded-lg p-6">
            <div class="header-container">
                <h1>Planificador</h1>
                <select id="month-selector"></select>
                <button id="save-changes-btn" class="action-button" disabled>Guardar Cambios</button>
            </div>
            <div id="view-container"></div>
        </div>
    </main>
    <div id="global-custom-options"></div>

    <script src="{{ url_for('static', filename='planificador.js') }}?v=1.2"></script>
    <script src="{{ url_for('static', filename='main.js') }}?v=1.2"></script>
</body>
</html>
